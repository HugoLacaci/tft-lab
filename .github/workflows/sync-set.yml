name: sync-set

on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC daily
  workflow_dispatch:
    inputs:
      count:
        description: "Unused; present so the run can be started by hand"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync live set from CommunityDragon
        run: npm run sync-set

      - name: Sync patch notes from Riot's news site
        run: npm run sync-patch-notes
        continue-on-error: true

      - name: Sync wisp costs and stages
        run: npm run sync-wisps
        continue-on-error: true

      - name: Diff the curated comps against the previous patch
        run: npm run sync-comps
        continue-on-error: true

      - name: Sync item / unit / comp statistics from the Riot API
        if: env.RIOT_API_KEY != ''
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: npm run sync-meta
        continue-on-error: true

      - name: Inspect result
        id: inspect
        shell: bash
        run: |
          echo "changed=$(git status --porcelain data/generated public/assets | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "patch=$(node -e "try{const p=require('./data/generated/patch-notes.json');console.log(p.notes[0]?.title||'')}catch{console.log('')}")" >> "$GITHUB_OUTPUT"
          echo "set_name=$(node -e "const c=require('./data/generated/current.json');const fs=require('fs');const m='content/sets/'+c.setNumber+'/meta.json';const d=fs.existsSync(m)?JSON.parse(fs.readFileSync(m,'utf8')).displayName:null;console.log((d&&d.trim())||('Set '+c.setNumber))")" >> "$GITHUB_OUTPUT"
          if [ -f data/generated/SET_CHANGED ]; then
            echo "new_set=true" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "A new set was detected. The data below is live; the written content needs a human pass."
              echo
              echo '```'
              cat data/generated/SET_CHANGED
              echo '```'
              echo
              echo "Runbook: see README → *When a new set drops*."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            rm data/generated/SET_CHANGED
          else
            echo "new_set=false" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "Scheduled sync of the live set data and mirrored icons. No set change."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validate and test with the new data
        if: steps.inspect.outputs.changed != '0'
        run: |
          npm run validate
          npm test

      # Same set: commit straight to the default branch and redeploy. Nothing to review:
      # validation and tests just passed on the new data.
      - name: Commit and deploy
        if: steps.inspect.outputs.changed != '0' && steps.inspect.outputs.new_set != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated public/assets
          git commit -m "chore: sync set data (${{ steps.inspect.outputs.set_name }})" -m "${{ steps.inspect.outputs.body }}"
          git push
          # Pushes made with GITHUB_TOKEN do not trigger other workflows; dispatch the deploy explicitly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"

      # New set: the data is live but the written content needs a human pass, so this stays a PR.
      - name: Open pull request (new set)
        if: steps.inspect.outputs.changed != '0' && steps.inspect.outputs.new_set == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/sync-set
          delete-branch: true
          commit-message: "chore: sync set data (${{ steps.inspect.outputs.set_name }})"
          title: "chore: sync set data (${{ steps.inspect.outputs.set_name }})"
          body: ${{ steps.inspect.outputs.body }}
          labels: new-set,sync
